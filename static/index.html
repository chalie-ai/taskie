<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/app.css?v=6" rel="stylesheet">
</head>
<body>

<div class="app">
  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sb-header">
      <div class="sb-title">Taskie</div>
      <button class="btn-icon" onclick="App.toggleSidebar()" title="Collapse sidebar" style="margin-left:auto;width:24px;height:24px" id="sb-collapse-btn">
        <svg class="svg-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M10 4l-4 4 4 4"/></svg>
      </button>
    </div>
    <button class="sb-search" onclick="App.openCmd()">
      <svg class="svg-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg>
      <span>Search or jump…</span>
      <span class="kbd">⌘K</span>
    </button>

    <div class="sb-cycle" id="sb-cycle-card" onclick="App.setView('cycle')"></div>

    <div class="sb-section">
      <button class="sb-item view-trigger" data-view="backlog" onclick="App.setView('backlog')">
        <span class="sb-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><path d="M5 6.5h6M5 9h4"/></svg></span>
        <span class="sb-label">Backlog</span>
        <span class="sb-count" id="cnt-backlog">0</span>
      </button>
    </div>

    <div class="sb-section">
      <div class="sb-section-title"><span>Projects</span><button onclick="App.showProjectsView()">+</button></div>
      <div id="sb-project-list"></div>
      <button class="sb-item view-trigger" data-view="projects" style="color:var(--text-muted)">
        <span class="sb-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4.5a1 1 0 011-1h3.5l1 1.5H13a1 1 0 011 1v6a1 1 0 01-1 1H3a1 1 0 01-1-1v-7.5z"/></svg></span>
        <span class="sb-label">All projects</span>
      </button>
    </div>

    <div class="sb-section">
      <div class="sb-section-title"><span>Cycles</span><button onclick="App.showNewCycleModal()">+</button></div>
      <div id="sb-cycle-list"></div>
    </div>

    <div class="sb-section" id="sb-people-section">
      <div class="sb-section-title"><span>People</span></div>
      <button class="sb-item view-trigger" data-view="users">
        <span class="sb-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="4.5" r="2.5"/><path d="M1.5 14c0-3 2-5.5 4.5-5.5s4.5 2.5 4.5 5.5"/><circle cx="11" cy="5" r="1.5"/><path d="M10 8.5c1 .5 2.5 1.5 2.5 3.5h3"/></svg></span>
        <span class="sb-label">Users</span>
        <span class="sb-count" id="cnt-users">0</span>
      </button>
    </div>

    <div class="sb-foot">
      <div class="sb-user" id="sb-user-area" onclick="App.setView('profile')">
        <span class="sb-avatar" id="sb-avatar">?</span>
        <span style="font-weight:500" id="sb-user-name">Login</span>
      </div>
      <button class="btn btn-secondary" style="width:100%;margin-top:8px;justify-content:center" onclick="App.logout()">Sign out</button>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <main class="main" id="main-content">
    <div class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-actions">
        <div class="view-tabs">
          <button data-mode="board">Board</button>
          <button data-mode="list">List</button>
        </div>
        <button class="btn btn-primary" onclick="App.showNewTicketModal()">New ticket <span class="kbd" style="background:rgba(255,255,255,0.18);border-color:transparent;color:rgba(255,255,255,0.85)">C</span></button>
      </div>
    </div>
    <div class="filterbar" id="filterbar">
      <div class="filterchip-wrap" style="position:relative">
        <button class="filterchip" id="fc-status" onclick="App.toggleFilterDropdown('status')">Status <svg class="svg-icon" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg></button>
        <div class="filter-drop" id="fd-status" style="display:none"></div>
      </div>
      <div class="filterchip-wrap" style="position:relative">
        <button class="filterchip" id="fc-priority" onclick="App.toggleFilterDropdown('priority')">Priority <svg class="svg-icon" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg></button>
        <div class="filter-drop" id="fd-priority" style="display:none"></div>
      </div>
      <div class="filterchip-wrap" style="position:relative">
        <button class="filterchip" id="fc-assignee" onclick="App.toggleFilterDropdown('assignee')">Assignee <svg class="svg-icon" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg></button>
        <div class="filter-drop" id="fd-assignee" style="display:none"></div>
      </div>
      <div class="filterchip-wrap" style="position:relative">
        <button class="filterchip" id="fc-type" onclick="App.toggleFilterDropdown('type')">Type <svg class="svg-icon" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6l4 4 4-4"/></svg></button>
        <div class="filter-drop" id="fd-type" style="display:none"></div>
      </div>
      <span class="filter-spacer"></span>
      <span class="filter-summary" id="filter-summary">0 tickets</span>
      <button class="btn btn-ghost" onclick="App.filters={status:null,priority:null,assignee_id:null,type:null};App.render()">Clear all</button>
    </div>
    <div id="content-area"><div class="spinner" style="margin:40px auto"></div></div>
  </main>
</div>

<!-- Bootstrap JS + jQuery + jQuery UI -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-ui-dist@1.13.3/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Markdown rendering: marked parses, DOMPurify sanitises (XSS-safe) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="/js/app.js?v=6"></script>

</body>
</html>
